fidelity:
  divergences: >-
    The compared statements are in the paper's terms and match the paper's Theorem 3.1; the library proves its own
    form and derives the paper's through proved equalities of the definitions. The amplitude is defined as the leading
    coefficient of the shifted Tr(phi^3) amplitude (arXiv:2312.16282, arXiv:2401.05483); the formalization proves
    its Feynman-rule form for every even n >= 4 (Corollary D.9) and Kampf et al.'s closed formulas at n = 4, 6,
    8, while its identity with the NLSM Lagrangian's amplitude is cited, not formalized (Remark 2.7). Also not formalized:
    the value of the sign in Remark F.17 (only that it is not zero), and Lemma F.8. The overall sign is that of
    arXiv:2610.01775; arXiv:2312.16282 eqs. (4.4), (7.17) write the opposite one at n = 4, and no zero depends on
    it. Out of scope: zeros on linear loci that no set of invariants cuts out (arXiv:2610.01775 §6.2), and four
    spacetime dimensions, where the planar variables satisfy Gram-determinant relations.

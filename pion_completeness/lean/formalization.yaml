alignment:
  note: >-
    One entry per statement of the companion paper that names its Lean declarations or records how they differ,
    in the paper's order, numbered as the paper prints them. Status proved or defined: the declarations state it
    as the paper does. Proved-in-another-form or defined-in-another-form: they state another form, and the note
    says how the forms differ and how they agree. Not-formalized: no declaration states it.
  statements:
  - source: Definition 2.1 (planar variables and mesh variables)
    lean:
    - PionCompleteness.TreeRectangleZero.diagonals
    - PionCompleteness.TreeRectangleZero.planar
    - PionCompleteness.TreeRectangleZero.mesh
    - PionCompleteness.TreeRectangleZero.vtx
    - PionCompleteness.PionZeros.oddDiagonals
    - PionCompleteness.PionNLSM.shiftSign
    - PionCompleteness.Pi.pkGQ
    modules:
    - PionCompleteness.Base.TreeRectangleZero
    - PionCompleteness.Base.PionZeros
    - PionCompleteness.Base.PionNLSM
    - PionCompleteness.C4
    status: defined-in-another-form
    note: >-
      Pi.pkGQ, the block sum, is minus the sum of the mesh variables over the numbers a < b of a finite set, adjacent
      ones included, read modulo N; here U is a set of legs.
  - source: Lemma 2.3 (the one relation)
    lean:
    - PionCompleteness.Paper.Amplitudes.Kinematics.Mesh.momentum_conservation_relation
    modules:
    - PionCompleteness.Paper
    status: proved
  - source: Definition 2.6 (the amplitudes)
    lean:
    - PionCompleteness.TreeRectangleZero.amp
    - PionCompleteness.TreeRectangleZero.triangulations
    - PionCompleteness.TreeRectangleZero.IsTriangulation
    - PionCompleteness.TreeRectangleZero.Crosses
    - PionCompleteness.PionNLSM.delta
    - PionCompleteness.PionNLSM.shifted
    - PionCompleteness.PionNLSM.shiftCoeff
    - PionCompleteness.PionNLSM.NLSM
    modules:
    - PionCompleteness.Base.TreeRectangleZero
    - PionCompleteness.Base.PionNLSM
    status: defined-in-another-form
    note: >-
      amp and NLSM are defined over any field, at every point, where 1/0 reads as 0; the paper's are the rational
      functions, which the Lean's are at the generic point (gen). NLSM is defined for every N, with no hypothesis
      that N is even; the statements that use it assume it. The Laurent series is in e = 1/delta: shiftCoeff takes
      the coefficient of e^(N-2) in amp over the field of Laurent series.
  - source: Remark 2.7 (the Lagrangian amplitude)
    lean:
    - PionCompleteness.Pi.nlsm_four_knt
    - PionCompleteness.Pi.nlsm_six_knt
    - PionCompleteness.Pi.nlsm_eight_knt
    modules:
    - PionCompleteness.Conventions
    status: proved-in-another-form
    note: >-
      The three declarations prove the relation at n = 4, 6, 8 with M_n the closed formulas of the cited paper (n
      = 8 off the poles), which that paper computed with the Feynman rules of the minimal parametrization; for every
      n the Lean proves the first step below (Corollary D.9).
  - source: Fact 2.8 (analytic inputs)
    lean:
    - PionCompleteness.Paper.NLSM.Amplitude.analytic_facts_delta_order
    - PionCompleteness.Paper.NLSM.Amplitude.analytic_facts_factorisation
    - PionCompleteness.Paper.NLSM.Amplitude.analytic_facts_symmetry
    modules:
    - PionCompleteness.Paper
    status: proved-in-another-form
    note: >-
      The Lean states homogeneity pointwise, over every field, for c not zero and at points where no odd chord vanishes,
      and the rotations over every field and for every number of steps: both stronger, the paper's forms their instances
      at the generic point. The factorization is stated as the vanishing of the difference on the hyperplane (RatZeroOn),
      the children relabeled by relab, as here.
  - source: Definition 2.11 (coordinate loci, regular sets and zeros)
    lean:
    - PionCompleteness.ChainSlice.OnLocus
    - PionCompleteness.Paper.NLSM.Zeros.IsRegularSet
    - PionCompleteness.PionNLSM.RatZeroOn
    - PionCompleteness.Paper.NLSM.Zeros.IsCoordinateZero
    - PionCompleteness.Paper.NLSM.Zeros.IsRegularCoordinateZero
    - PionCompleteness.Paper.ratZeroOn_add
    modules:
    - PionCompleteness.Base.ChainSlice
    - PionCompleteness.Paper
    - PionCompleteness.Base.PionNLSM
    status: defined-in-another-form
    note: >-
      The Lean reads a polynomial vanishing identically on the locus as vanishing at every rational point of it,
      which is the same over the rationals; RatZeroOn is defined for any set of points. In Lean a set of pairs is
      a subset of diagonals N: OnLocus, IsRegularSet and IsCoordinateZero do not assume it; IsRegularCoordinateZero
      does. The Lean's points are functions on all pairs of numbers, not only on the chords; the planar variables
      and the amplitude read only the chords, so the other coordinates are free on the locus and change nothing.
      IsCoordinateZero has no hypothesis that N is even; the statements assume it. That the sum of two rational
      functions that vanish identically on a linear subspace vanishes identically on it is Paper.ratZeroOn_add;
      that the definition does not depend on the choice of the numerator and the denominator is not a Lean statement.
      The library's proofs use the pointwise forms ChainSlice.Nondeg and Pi.IsNDZero, the latter through Pi.AmpZeroOn,
      for the amplitude times minus one to the power N/2 - 1, at the points at which no odd chord vanishes. They
      are equal to the forms here by Paper.NLSM.Zeros.isRegularSet_iff_nondeg and Paper.NLSM.Zeros.isRegularCoordinateZero_iff_isNDZero.
  - source: Lemma 2.13 (zeros pointwise)
    lean:
    - PionCompleteness.Paper.NLSM.Zeros.isCoordinateZero_iff_pointwise
    modules:
    - PionCompleteness.Paper
    status: proved
  - source: Definition 2.14 (minimal zero)
    lean:
    - PionCompleteness.Paper.NLSM.Zeros.IsMinimalCoordinateZero
    modules:
    - PionCompleteness.Paper
    status: defined
  - source: Remark 2.16 (why minimal zeros)
    lean:
    - PionCompleteness.Paper.NLSM.Zeros.isCoordinateZero_of_subset
    - PionCompleteness.Paper.NLSM.Zeros.exists_minimal_coordinate_zero_subset
    - PionCompleteness.Paper.NLSM.Zeros.isCoordinateZero_iff_contains_minimal
    modules:
    - PionCompleteness.Paper
    status: proved-in-another-form
    note: >-
      The momentum language is not Lean's. The Lean states the three steps for a set S of pairs, with N even and
      at least 4 where a zero is read pointwise, as in Lemma 2.13: a regular S, inside diagonals N, is a zero if
      a zero Z inside it is (isCoordinateZero_of_subset), a regular coordinate zero contains a minimal one (exists_minimal_coordinate_zero_subset),
      and so a regular S is a zero exactly when it contains a minimal one (isCoordinateZero_iff_contains_minimal).
  - source: Definition 2.17 (separated pairs)
    lean:
    - PionCompleteness.Pi.sepPairs
    - PionCompleteness.PionZeros.InST
    modules:
    - PionCompleteness.C0
    - PionCompleteness.Base.PionZeros
    status: defined-in-another-form
    note: >-
      Pi.sepPairs is the set of the pairs that PionZeros.InST picks: both legs outside G, a leg of G strictly between
      them and a leg of G outside them. That is the second form of the definition. Pi.sepPairs takes any finite
      set of numbers; here G is a set of legs.
  - source: Remark 2.19 (separated pairs in momentum language)
    lean:
    - PionCompleteness.Paper.Amplitudes.Kinematics.Mesh.separated_pairs_eq_blocks
    - PionCompleteness.Paper.Amplitudes.Kinematics.Mesh.separated_pairs_block_tile
    - PionCompleteness.Paper.Combinatorics.Polygons.nextCut
    modules:
    - PionCompleteness.Paper
    status: proved-in-another-form
    note: >-
      The momentum language and the cited zeros are not Lean's. The Lean names each arc by the leg of G before it:
      the gap after a leg g of G is the legs vtx N i for g < i < nextCut N G g, numbered past N where it wraps around.
      S_G is the union, over legs g < h of G, of the tiles c(i, j) with i in the gap after g and j in the gap after
      h: the image under tlab of a product of two ranges of integers with i < j < i + N, the form in which ChainSlice.diamond
      writes a causal diamond; an empty gap gives an empty block. That such a range of tiles is a rectangular block
      in the picture is the mesh's layout (Definition 2.1), not a Lean statement.
  - source: Definition 2.20 (causal diamonds)
    lean:
    - PionCompleteness.Paper.NLSM.Zeros.Families.IsCausalDiamond
    - PionCompleteness.ChainSlice.diamond
    - PionCompleteness.TreeRectangleZero.OnRect
    - PionCompleteness.Paper.Amplitudes.Kinematics.Mesh.separated_pairs_of_two_legs_eq_diamond
    modules:
    - PionCompleteness.Paper
    - PionCompleteness.Base.ChainSlice
    - PionCompleteness.Base.TreeRectangleZero
    status: defined-in-another-form
    note: >-
      IsCausalDiamond states it, for legs a < b, with "the set of the two legs has two arcs" as a leg strictly between
      a and b and a leg outside them. The library's proofs use two other forms. ChainSlice.diamond, the diamond
      anchored at a chord, is a causal diamond written as a range of tiles, not as separated pairs: anchored at
      the chord of the two legs after a and b, it is the causal diamond of a and b. For legs a < b, Paper.Amplitudes.Kinematics.Mesh.separated_pairs_of_two_legs_eq_diamond
      states that it is the set of their separated pairs, with the anchor written with the number n + 1 when b =
      n. Anchored instead at the chord of the legs 1 and a + 1, the same tiles for the legs a and n are not a Lean
      statement. TreeRectangleZero.OnRect, the hypothesis of the Lean's diamond zero, takes the number of legs between
      a and b and the leg after a, and is the coordinate locus of the causal diamond of a and b. That it lies in
      the locus of the separated pairs is Pi.pkL_onLocus_anchor; the converse is ChainSlice.onRect_of_diamond, stated
      for ChainSlice.diamond anchored at a chord, so not for the legs a and n. Pi.IsMixedAnchor picks out the causal
      diamonds anchored at an odd planar variable.
  - source: Definition 2.21 (T-separated sets and the list)
    lean:
    - PionCompleteness.Paper.NLSM.Zeros.Families.IsListMember
    - PionCompleteness.Pi.gFamily
    - PionCompleteness.PionZeros.OnZT
    modules:
    - PionCompleteness.Paper
    - PionCompleteness.C0
    - PionCompleteness.Base.PionZeros
    status: defined-in-another-form
    note: >-
      IsListMember states the list, with the T-separated sets for |T| at least three written out: the Lean has no
      definition of a T-separated set of its own. The library's list gFamily, which its proofs use, is the second
      form in Lemma 2.22; the two forms are equal for even N by Paper.NLSM.Zeros.Families.isListMember_iff_mem_gFamily.
      gFamily needs even N: for odd N it contains the empty set (the test PaperTests.empty_mem_gFamily_of_odd).
      The Lean's other form of the T-separated locus, OnZT, equals the coordinate locus of the separated pairs for
      T a subset of the legs (Paper.onZT_iff_onLocus_sepPairs). sepPairs accepts any set of numbers; the paper's
      G is a set of legs.
  - source: Lemma 2.22 (the list's second form)
    lean:
    - PionCompleteness.Paper.NLSM.Zeros.Families.isListMember_iff_mem_gFamily
    - PionCompleteness.Paper.Combinatorics.Polygons.opposite_parity_gaps_even
    modules:
    - PionCompleteness.Paper
    status: proved-in-another-form

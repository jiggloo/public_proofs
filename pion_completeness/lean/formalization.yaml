    - PionCompleteness.C8
    status: proved-in-another-form
    note: >-
      The Lean states the non-vanishing facts of (b) one by one, each as a point: genericity and pkR_G2 for X_P
      on the locus of the empty set at xi = 0, pkR_Gq for the locus of one chord q, pkR_xwit and pkR_c9_wit for
      xi on the locus of the empty set (that xi does not vanish identically on the locus of a non-empty I is not
      stated in the Lean). For (c), on W_q (pkRW), pkR_lamI_W is the inclusion of the locus of I in W_q for q in
      I. genericity_w_independent states xi' = xi + c(alpha, beta) and that xi and xi' are linearly independent.
      genericity_w_pairs states, for each of xi, xi' and X_Q, a point of W_q at which it is non-zero, and that no
      two of the three are proportional, which for linear forms says that one does not vanish identically on the
      zero set of the other. pkR_GW_pair states, for two chords Q, Q' other than q, a point of W_q at which X_Q
      is zero and X_Q' is not. genericity_span is a consequence. pkR_XQ gives the last sentence of (a), X_Q = xi
      for Q in I; the coordinates and the formula of (a) are not stated in the Lean, whose witnesses are explicit
      points.

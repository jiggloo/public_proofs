    status: proved-in-another-form
    note: >-
      pkR_omega states this for the standard polygon (n, d1), the n-gon with the marked leg r = 2 d1 + 1, and every
      set I of chords over r (pkRIsMem), with NP the numerator, the identity at every rational point of the locus;

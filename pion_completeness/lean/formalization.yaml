    - PionCompleteness.Pi.pkRBNP
    modules:
    - PionCompleteness.C6
    - PionCompleteness.C7
    - PionCompleteness.Base.PionNLSM
    status: defined-in-another-form
    note: >-
      The Lean's standard polygon (n, d1) is the n-gon with the marked leg r = 2 d1 + 1. A chord over r is pkRIsMem
      of an index pair (i, j), whose chord pkRMchord is (2i + 1, 2 d1 + 2j + 2) and whose odd-ended side is 2i +
      1, ..., 2 d1 + 2j + 1. pkRLam n d1 I is the marked locus, with xi the mesh variable of the legs 1 and n -
      1 and xi' that of the pair pkRCstp; its third condition uses pkRMinrect, the flank overlap. NP is the numerator
      of the amplitude, defined in the Lean as the coefficient of the delta-expansion of a polynomial numerator,
      and equal to the amplitude times the product of the odd planar variables wherever none of them vanishes (nlsm_numerator_hom);
      pkRBNP n K is the numerator of the amplitude avoiding K.
  - source: Lemma F.11 (coordinates on the marked locus)
    lean:

    - PionCompleteness.C8
    - PionCompleteness.C7
    status: proved-in-another-form
    note: >-
      The Lean reads the B-child of q in a rotated labeling, pkR_childB: the leg n of the n-gon stays the last leg
      and the new leg is the marked one. Here the B-child is numbered as in Definition 6.6, from the first leg of
      B_q, so the new leg is last and the leg n is the marked leg; the two are the same polygon, rotated. The facts
      of (i) are not separate Lean statements. That the marked legs of the children are odd is the form of the marked
      locus pkRLam, whose marked leg is 2 d1 + 1 for its parameter d1. Which chords of I are chords of each child
      is the set that genericity_regions, pkR_childA and pkR_childB pass to it: the members of I nested inside q
      or around q, shifted. That the other members cross q is not stated. (iii) is pkR_omega_split read at a point
      of the marked locus; the identity as stated here is its first step, pkR_b_res1 at the set of the one chord
      C. That the odd chords other than C are the chords of the two children and those crossing C is not stated
      in the Lean.

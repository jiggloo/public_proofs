version: v0.4
project:
  name: Completeness of the coordinate zeros of tree-level pion amplitudes
  description: >-
    A Lean 4 / Mathlib proof of the classification of the minimal coordinate zeros of the tree-level amplitudes
    of pions, those of the non-linear sigma model (NLSM). For every even number n >= 6 of pions, the minimal sets
    of Mandelstam invariants s_ab whose vanishing makes the flavor-ordered amplitude vanish identically, without
    making a propagator vanish identically, are exactly the causal diamonds of the kinematic mesh (the hidden zeros)
    and the T-separated sets, for T any set of at least three legs of one parity: the invariants s_ab of every two
    legs a and b outside T that T separates. The formalization proves both parts of the classification: completeness
    (every such zero contains a causal diamond or a T-separated set) and minimality (each of these sets is a zero,
    and none stays one when one of its invariants is left free). The zeros on the causal diamonds, and on the T-separated
    sets for |T| = 3 and for T a whole parity class, were known; completeness and the zeros for 4 <= |T| <= n/2
    - 1 were not found in earlier work. The amplitude is the tree-level, flavor-ordered, massless amplitude in general
    spacetime dimension, with the planar variables independent. Comparator checks the three compared statements
    against a self-contained Challenge in the paper's terms.
  authors:
  - Henru Wang
  responsible_maintainers:
  - Henru Wang
  license: Apache-2.0

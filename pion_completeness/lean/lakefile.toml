name = "pion_completeness"
version = "0.1.0"
defaultTargets = ["PionCompleteness"]

# Mathlib's standard settings for new projects. A linter switched off here needs a reason in a comment.
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"   # tag v4.35.0; all transitive revs pinned in lake-manifest.json

# One library. The root file PionCompleteness.lean imports every module, so `lake build` builds them all.
[[lean_lib]]
name = "PionCompleteness"

# The axioms check: `lake build Verify` checks the axioms of the listed results and fails on any
# beyond Lean's standard three. Not a default target; a library rather than a script, so every
# file is built by some library.
[[lean_lib]]
name = "Verify"

# The statement pins: `lake build Statements` prints the statements of Theorem Π and every
# declaration of `Paper`, `PaperTests` and `Conventions`, and fails on any change
# (`#guard_msgs`).
# Not a default target, like Verify.
[[lean_lib]]
name = "Statements"

# The Challenge for Palomar's comparator: the main theorem in the paper's form, with every
# definition it uses copied from the library, importing Mathlib only. Comparator, run on
# `comparator.json`, checks that `PionCompleteness.Paper` proves these statements with the same
# definitions. Its name is unique to this project, so that projects sharing one workspace do not
# clash. No library imports it; not a default target, like Verify.
[[lean_lib]]
name = "PionCompletenessChallenge"
